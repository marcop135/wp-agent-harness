# Netlify only keeps the old host redirecting (below). Every build is skipped,
# so pushes and pull requests no longer trigger deploys; the last deploy stays live.
[build]
  publish = "site"
  command = "true"
  ignore = "exit 0"

# The marketing site moved to wpagent.marcopontili.com (Netsons). Every path
# on the Netlify host answers with a permanent redirect to the same path there.
[[redirects]]
  from = "/*"
  to = "https://wpagent.marcopontili.com/:splat"
  status = 301
  force = true
