# Apache configuration for the local WordPress container.

<Directory /var/www/html>
    # WordPress writes .htaccess for pretty permalinks, which the
    # /wp-json/mcp/... endpoint depends on.
    AllowOverride All
    Require all granted
</Directory>

# mod_php does not pass the Authorization header through to PHP on every
# build. WordPress Application Password authentication reads it, so it is
# copied into the environment explicitly.
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
